name: QuailEgg Release
on:
  push:
    branches: ["main"]
    paths:
      - ".changes/**"
      - ".quailegg.toml"
      - ".quailegg/pre-release.lock"
      - ".quailegg/release.json"
      - "CHANGELOG.md"
      - "ender_infection_colored/build.gradle"
      - "ender_infection_colored/build.gradle.kts"
      - "ender_infection_colored/pom.xml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: qegg-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-go@v5
        with: { go-version: '1.26', cache: true }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install qegg
        run: go install github.com/SuperQuail/QuailEgg/cmd/qegg@latest
      - name: Release
        run: qegg release --yes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
