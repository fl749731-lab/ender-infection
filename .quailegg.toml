# Generated by qegg. Keep this file in version control.
schema_version = 1

[project]
default_branch = "main"
repo = "github.com/fl749731-lab/ender-infection"

[git]
tag_prefix = "v"
remote = "origin"

[release]
mode = "pr"
github_release = true
commit_message = "chore(release): v{{version}}"

[changes]
dir = ".changes"
scope = ["ender_infection_colored"]

[verify]
commands = ["cd ender_infection_colored && java -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain build"]
timeout = "15m"
fail_fast = true

[publish]
registries = []

[release.assets]
# Rebuild after the version bump; clean keeps only the current jar, which is attached to the GitHub Release.
commands = ["cd ender_infection_colored && java -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain clean build"]
files = ["ender_infection_colored/build/libs/*.jar"]

[packages."java@ender_infection_colored"]
name = "ender_infection_colored"
path = "ender_infection_colored"
resolver = "java"
publish = false
