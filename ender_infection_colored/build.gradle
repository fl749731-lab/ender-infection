plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
version = '0.5.0'
group = 'dev.hui.enderinfection'
base { archivesName = 'ender-infection' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
jar {
    manifest {
        attributes([
                "Specification-Title"     : "ender_infection",
                "Specification-Vendor"    : "hui",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "hui"
        ])
    }
}
minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { ender_infection { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
        gameTestServer {
            workingDirectory project.file("build/gametest-${System.currentTimeMillis()}")
            property 'forge.enabledGameTestNamespaces','ender_infection'
        }
    }
}
repositories {
    mavenCentral()
    maven {
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroupByRegex 'software\\.bernie.*'; includeGroup 'com.eliotlash.mclib' }
    }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.12'
    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.20.1:4.4.9')
    implementation 'com.eliotlash.mclib:mclib:20'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar.finalizedBy('reobfJar')
