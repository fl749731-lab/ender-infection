plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
version = '0.12.0-alpha.7'
group = 'dev.hui.enderinfection'
base { archivesName = 'ender-infection' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
sourceSets.main.java.srcDir('../common/src/main/java')
def gameTestRunDirectory = project.file("build/gametest-${System.currentTimeMillis()}")
jar {
    manifest {
        attributes([
                "Specification-Title"     : "ender_infection",
                "Specification-Vendor"    : "hui",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "hui"
        ])
    }
}
minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { ender_infection { source sourceSets.main } }
        }
        client { property 'mixin.env.remapRefMap','true'; property 'mixin.env.refMapRemappingFile',project.file('build/createSrgToMcp/output.srg').absolutePath; if (project.hasProperty('designSmoke')) { workingDirectory project.file('build/design-smoke'); property 'ender_infection.designSmoke','true' } }
        if (project.hasProperty('wardenVfxCheck')) {
            client { workingDirectory project.file('build/warden-vfx-check'); property 'ender_infection.wardenVfxCheck','true'; args '--width','1280','--height','800' }
        }
        if (project.hasProperty('wardenVisualCheck')) {
            client { workingDirectory project.file('build/warden-visual-check'); property 'ender_infection.wardenVisualCheck','true' }
        }
        if (project.hasProperty('crystalCheck')) {
            client {
                workingDirectory project.file('build/crystal-check')
                property 'ender_infection.crystalCheck','true'
            }
        }
        if (project.hasProperty('crystalGlowCheck')) {
            client {
                workingDirectory project.file('build/crystal-glow-check')
                property 'ender_infection.crystalGlowCheck','true'
                property 'ender_infection.crystalGlowSubjects',project.findProperty('crystalGlowSubjects') ?: ''
            }
        }
        if (project.hasProperty('riftVisualCheck')) {
            client { workingDirectory project.file('build/rift-visual-check'); property 'ender_infection.riftVisualCheck','true' }
        }
        if (project.hasProperty('conceptCheck')) {
            client {
                workingDirectory project.file('build/concept-check')
                property 'ender_infection.conceptCheck','true'
                property 'ender_infection.conceptSubjects',project.findProperty('conceptSubjects') ?: ''
                jvmArgs '-Xms128m', '-Xmx1536m', '-XX:ActiveProcessorCount=2'
            }
        }
        if (project.hasProperty('labDoorVisualCheck')) {
            client { workingDirectory project.file('build/lab-door-visual-check'); property 'ender_infection.labDoorVisualCheck','true'; args '--width','1280','--height','800' }
        }
        if (project.hasProperty('labVisualCheck')) {
            client { workingDirectory project.file('build/lab-visual-check'); property 'ender_infection.labVisualCheck','true' }
        }
        if (project.hasProperty('architectureCheck')) {
            client { workingDirectory project.file('build/architecture-check'); property 'ender_infection.architectureCheck','true' }
        }
        if (project.hasProperty('centralInstituteVisualCheck')) {
            client { property 'ender_infection.architectureVisualCheck', project.hasProperty('architectureVisualCheck').toString() }
            client { workingDirectory project.file('build/central-institute-visual-check'); property 'ender_infection.centralInstituteVisualCheck','true'; property 'ender_infection.centralInstituteSeed',project.findProperty('centralInstituteSeed') ?: '7312026'; jvmArgs '-Xms128m', '-Xmx1536m', '-XX:ActiveProcessorCount=2' }
        }
        if (project.hasProperty('storageVisualCheck')) {
            client { workingDirectory project.file('build/storage-visual-check'); property 'ender_infection.storageVisualCheck','true'; jvmArgs '-Xms128m', '-Xmx1536m', '-XX:ActiveProcessorCount=2' }
        }
        if (project.hasProperty('operationsVisualCheck')) {
            client { workingDirectory project.file('build/operations-visual-check'); property 'ender_infection.operationsVisualCheck','true'; jvmArgs '-Xms128m', '-Xmx1536m', '-XX:ActiveProcessorCount=2' }
        }
        if (project.hasProperty('incidentVisualCheck')) {
            client { workingDirectory project.file('build/incident-visual-check'); property 'ender_infection.incidentVisualCheck','true' }
        }
        if (project.hasProperty('naturalLabCheck')) {
            client { workingDirectory project.file('build/natural-lab-check'); property 'ender_infection.naturalLabCheck','true'; property 'ender_infection.naturalBiome',project.findProperty('naturalBiome') ?: 'mushroom_fields'; property 'ender_infection.naturalBuilding',project.findProperty('naturalBuilding') ?: ''; property 'ender_infection.naturalRerender',project.hasProperty('naturalRerender').toString() }
        }
        server {
            args '--nogui'
            if (project.hasProperty('wardenPersistenceStage')) {
                workingDirectory project.file(project.property('wardenPersistenceDirectory'))
                property 'ender_infection.wardenPersistenceCheck',project.property('wardenPersistenceStage')
            }
            if (project.hasProperty('incidentPersistenceStage')) {
                workingDirectory project.file(project.property('incidentPersistenceDirectory'))
                property 'ender_infection.incidentPersistenceCheck', project.property('incidentPersistenceStage')
            }
        }
        gameTestServer {
            workingDirectory gameTestRunDirectory
            jvmArgs '-Xms128m', '-Xmx1536m', '-XX:ActiveProcessorCount=2'
            if (project.hasProperty('instituteChecks')) property 'ender_infection.instituteChecks','true'
            property 'forge.enabledGameTestNamespaces',project.hasProperty('wardenChecks')?'ender_warden_checks':project.hasProperty('incidentChecks')?'ender_incident_checks':project.hasProperty('operationsChecks')?'ender_operations_checks':project.hasProperty('processingChecks')?'ender_processing_checks':project.hasProperty('storageChecks')?'ender_storage_checks':project.hasProperty('centralInstituteChecks')?'ender_central_institute_checks':project.hasProperty('regressionChecks')?'ender_regression_checks':project.hasProperty('instituteChecks')?'ender_institute_checks':project.hasProperty('riftChecks')?'ender_rift_checks,ender_ai_checks':project.hasProperty('oreChecks')?'ender_ore_checks':project.hasProperty('expansionChecks')?'ender_expansion_checks':project.hasProperty('aiChecks')?'ender_ai_checks':project.hasProperty('labChecks')?'ender_lab_checks':'ender_infection,ender_lab_checks,ender_ore_checks'
        }
    }
}
repositories {
    mavenCentral()
    maven {
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroupByRegex 'software\\.bernie.*'; includeGroup 'com.eliotlash.mclib' }
    }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.12'
    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.20.1:4.4.9')
    implementation 'com.eliotlash.mclib:mclib:20'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar.finalizedBy('reobfJar')

// Forge's GameTest launcher uses ordinary server world settings but starts arenas at Y=-60.
// A default noise world therefore puts them underground and drops cave gravel into live tests.
// Match the controlled flat world used by the vanilla/NeoForge GameTest launcher.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        gameTestRunDirectory.mkdirs()
        new File(gameTestRunDirectory, 'server.properties').setText('''level-type=minecraft:flat
level-seed=0
generate-structures=false
generator-settings={"biome":"minecraft:plains","layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"structure_overrides":[],"lakes":false,"features":false}
''', 'UTF-8')
    }
}

// Unmapped development classes for standalone addon compilation. Never ship/shade this in an addon.
tasks.register('apiDevJar', Jar) {
    dependsOn classes
    archiveFileName = 'ender-infection-api-dev.jar'
    destinationDirectory = layout.buildDirectory.dir('api')
    from sourceSets.main.output
    manifest.attributes('Implementation-Version': project.version)
}
