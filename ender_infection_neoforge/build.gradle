plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = new File(rootDir, '../ender_infection_colored/build.gradle').getText('UTF-8').find(/version\s*=\s*['"]([^'"]+)['"]/) { full, value -> value }
group = 'dev.hui.enderinfection'
base { archivesName = 'ender-infection-neoforge-1.21.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven {
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup 'software.bernie.geckolib' }
    }
}
dependencies {
    implementation 'software.bernie.geckolib:geckolib-neoforge-1.21.1:4.9.3'
}
sourceSets.main.java.srcDir('../common/src/main/java')
def sharedResources = tasks.register('syncSharedResources', Exec) {
    inputs.dir('../ender_infection_colored/src/main/resources')
    inputs.file('../tools/sync_neoforge_resources.py')
    outputs.dir(layout.buildDirectory.dir('generated/sharedResources'))
    workingDir rootProject.projectDir.parentFile
    commandLine 'python', 'tools/sync_neoforge_resources.py'
}
sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/sharedResources'))
tasks.named('processResources').configure { dependsOn sharedResources }

neoForge {
    version = '21.1.265'
    ideSyncTask sharedResources
    runs {
        client {
            client()
            gameDirectory = project.file(project.hasProperty('crystalGlowCheck') ? 'build/crystal-glow-check' : project.hasProperty('riftVisualCheck') ? 'build/rift-visual-check' : 'build/client-review')
            if (project.hasProperty('designSmoke')) systemProperty 'ender_infection.designSmoke', 'true'
            if (project.hasProperty('riftVisualCheck')) systemProperty 'ender_infection.riftVisualCheck', 'true'
            if (project.hasProperty('conceptCheck')) {
                gameDirectory = project.file('build/concept-check')
                systemProperty 'ender_infection.conceptCheck', 'true'
                systemProperty 'ender_infection.conceptSubjects', project.findProperty('conceptSubjects') ?: ''
                jvmArgument '-Xms128m'
                jvmArgument '-Xmx1536m'
                jvmArgument '-XX:ActiveProcessorCount=2'
            }
            if (project.hasProperty('storageVisualCheck')) {
                gameDirectory = project.file('build/storage-visual-check')
                systemProperty 'ender_infection.storageVisualCheck', 'true'
                jvmArgument '-Xms128m'
                jvmArgument '-Xmx1536m'
                jvmArgument '-XX:ActiveProcessorCount=2'
            }
            if (project.hasProperty('operationsVisualCheck')) {
                gameDirectory = project.file('build/operations-visual-check')
                systemProperty 'ender_infection.operationsVisualCheck', 'true'
                jvmArgument '-Xms128m'
                jvmArgument '-Xmx1536m'
                jvmArgument '-XX:ActiveProcessorCount=2'
            }
            if (project.hasProperty('wardenVisualCheck')) {
                gameDirectory = project.file('build/warden-visual-check')
                systemProperty 'ender_infection.wardenVisualCheck', 'true'
            }
            if (project.hasProperty('incidentVisualCheck')) {
                gameDirectory = project.file('build/incident-visual-check')
                systemProperty 'ender_infection.incidentVisualCheck', 'true'
            }
            if (project.hasProperty('centralInstituteVisualCheck')) {
                gameDirectory = project.file('build/central-institute-visual-check')
                systemProperty 'ender_infection.centralInstituteVisualCheck', 'true'
                systemProperty 'ender_infection.centralInstituteSeed', project.findProperty('centralInstituteSeed') ?: '7312026'
                jvmArgument '-Xms128m'
                jvmArgument '-Xmx1536m'
                jvmArgument '-XX:ActiveProcessorCount=2'
            }
            if (project.hasProperty('crystalGlowCheck')) {
                systemProperty 'ender_infection.crystalGlowCheck', 'true'
                systemProperty 'ender_infection.crystalGlowSubjects', project.findProperty('crystalGlowSubjects') ?: ''
            }
        }
        server {
            server(); programArgument '--nogui'; gameDirectory = project.file('build/server-review')
            if (project.hasProperty('wardenPersistenceStage')) {
                gameDirectory = project.file(project.property('wardenPersistenceDirectory'))
                systemProperty 'ender_infection.wardenPersistenceCheck', project.property('wardenPersistenceStage')
            }
            if (project.hasProperty('incidentPersistenceStage')) {
                gameDirectory = project.file(project.property('incidentPersistenceDirectory'))
                systemProperty 'ender_infection.incidentPersistenceCheck', project.property('incidentPersistenceStage')
            }
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file("build/gametest-${System.currentTimeMillis()}")
            if (project.hasProperty('instituteChecks')) systemProperty 'ender_infection.instituteChecks', 'true'
            def namespaces = []
            if (project.hasProperty('wardenChecks')) namespaces += 'ender_warden_checks'
            if (project.hasProperty('incidentChecks')) namespaces += 'ender_incident_checks'
            if (project.hasProperty('operationsChecks')) namespaces += 'ender_operations_checks'
            if (project.hasProperty('processingChecks')) namespaces += 'ender_processing_checks'
            if (project.hasProperty('storageChecks')) namespaces += 'ender_storage_checks'
            if (project.hasProperty('centralInstituteChecks')) namespaces += 'ender_central_institute_checks'
            if (project.hasProperty('instituteChecks')) namespaces += 'ender_institute_checks'
            if (project.hasProperty('oreChecks')) namespaces += 'ender_ore_checks'
            if (project.hasProperty('labChecks')) namespaces += 'ender_lab_checks'
            if (project.hasProperty('regressionChecks')) namespaces += 'ender_regression_checks'
            if (project.hasProperty('riftChecks')) namespaces += ['ender_rift_checks', 'ender_ai_checks']
            if (project.hasProperty('aiChecks') && !project.hasProperty('riftChecks')) namespaces += 'ender_ai_checks'
            if (namespaces.isEmpty()) namespaces += ['ender_infection','ender_lab_checks','ender_ore_checks']
            systemProperty 'neoforge.enabledGameTestNamespaces', namespaces.join(',')
        }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods { ender_infection { sourceSet sourceSets.main } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.compilerArgs += ['-Xmaxerrs', '1000'] }
jar {
    manifest {
        attributes('Implementation-Title': 'Ender Infection NeoForge 1.21.1',
                   'Implementation-Version': project.version,
                   'Implementation-Vendor': 'hui')
    }
}

// Development classes for the independently built extension examples. Never a release artifact.
tasks.register('apiDevJar', Jar) {
    dependsOn classes
    archiveFileName = 'ender-infection-api-dev.jar'
    destinationDirectory = layout.buildDirectory.dir('api')
    from sourceSets.main.output
    manifest { attributes('Implementation-Version': project.version) }
}
