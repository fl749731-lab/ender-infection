<text x="64" y="1620" fill="#617583" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" text-anchor="start" dominant-baseline="central">A—A 剖线穿过中庭、北侧研究房和南侧入口；四角研究翼、温室及门路详见六层平面。</text>
